# =============================================================================
# LOCAL SELF-HOSTED DEPLOYMENT
# =============================================================================
# Runs ApplyPilot on your own computer — no GCP account needed.
#
# Quick start:
#   1. make start                       (auto-generates .env with secrets, then runs compose)
#   2. The app container applies DB migrations, then starts uvicorn (docker-entrypoint.sh).
#   3. Open http://localhost:8000
#   4. Add your Gemini API key in Settings → AI Setup
#
# The DATABASE_URL and REDIS_URL in your .env are automatically overridden
# to point at the postgres and redis containers below.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — application database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-autopilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Redis — caching, rate limiting, JWT revocation, auth tokens
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # ApplyPilot app
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    # `.env` is mounted below and read by Pydantic inside the app, so host and
    # container share one live configuration file.
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autopilot}
      REDIS_URL: redis://redis:6379/0
      BASE_URL: http://localhost:8000
      # `app` is the private Compose DNS name used by the local ZAP container.
      ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,app"
      CORS_ORIGINS: "http://localhost:8000"
      WATCHFILES_FORCE_POLLING: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Live, bidirectional development mounts. Python reloads automatically;
      # DEBUG=true serves UI sources directly without rebuilding the image.
      - ./api:/app/api
      - ./agents:/app/agents
      - ./config:/app/config
      - ./models:/app/models
      - ./services:/app/services
      - ./utils:/app/utils
      - ./workflows:/app/workflows
      - ./ui:/app/ui
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./main.py:/app/main.py
      - ./alembic.ini:/app/alembic.ini
      - ./.env:/app/.env
      # Persist runtime output outside the container.
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./generated:/app/generated
      # Durable, appuser-owned storage for uploaded resume originals.
      - resume_data:/app/data
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app", "--reload-include", ".env"]

volumes:
  postgres_data:
  redis_data:
  resume_data:
