# =============================================================================
# LOCAL SELF-HOSTED DEPLOYMENT
# =============================================================================
# Runs Autopilot on your own computer — no GCP account needed.
#
# Quick start:
#   1. make start                       (auto-generates .env with secrets, then runs compose)
#   2. The app container applies DB migrations, then starts uvicorn (docker-entrypoint.sh).
#   3. Open http://localhost:8000
#   4. Add your Gemini API key in Settings → AI Setup
#
# The DATABASE_URL and REDIS_URL in your .env are automatically overridden
# to point at the postgres and redis containers below.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — application database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-autopilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  adminer:
    image: adminer
    container_name: autopilot_adminer
    restart: unless-stopped
    ports:
      - 9004:8080
  # ---------------------------------------------------------------------------
  # Redis — caching, rate limiting, JWT revocation, auth tokens
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  # ---------------------------------------------------------------------------
  # MongoDB — isolated encrypted portal credential vault
  # ---------------------------------------------------------------------------
  portal-vault:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      # 27018 is in a Windows reserved range on common Podman/WSL setups.
      - "27118:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${PORTAL_VAULT_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${PORTAL_VAULT_ROOT_PASSWORD}
      PORTAL_VAULT_APP_USERNAME: ${PORTAL_VAULT_APP_USERNAME}
      PORTAL_VAULT_APP_PASSWORD: ${PORTAL_VAULT_APP_PASSWORD}
      PORTAL_VAULT_MONGODB_DATABASE: ${PORTAL_VAULT_MONGODB_DATABASE:-autopilot_vault}
    volumes:
      - portal_vault_data:/data/db
      - portal_vault_config_data:/data/configdb
      - ./scripts/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mongosh --quiet --username "$${MONGO_INITDB_ROOT_USERNAME}" --password "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "db.adminCommand('ping').ok" | grep 1
      interval: 5s
      timeout: 5s
      retries: 15

  # ---------------------------------------------------------------------------
  # Autopilot app
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    # `.env` is mounted below and read by Pydantic inside the app, so host and
    # container share one live configuration file.
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-autopilot}
      REDIS_URL: redis://redis:6379/0
      BASE_URL: http://localhost:8000
      # `app` is the private Compose DNS name used by the local ZAP container.
      ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,app"
      CORS_ORIGINS: "http://localhost:8000"
      WATCHFILES_FORCE_POLLING: "true"
      RESUME_STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: autopilot-resumes
      MINIO_SECURE: "false"
      PORTAL_VAULT_ENABLED: "true"
      PORTAL_VAULT_MONGODB_URL: mongodb://${PORTAL_VAULT_APP_USERNAME}:${PORTAL_VAULT_APP_PASSWORD}@portal-vault:27017/${PORTAL_VAULT_MONGODB_DATABASE:-autopilot_vault}?authSource=${PORTAL_VAULT_MONGODB_DATABASE:-autopilot_vault}
      PORTAL_VAULT_MONGODB_DATABASE: ${PORTAL_VAULT_MONGODB_DATABASE:-autopilot_vault}
      PORTAL_VAULT_ENCRYPTION_KEY: ${PORTAL_VAULT_ENCRYPTION_KEY}
      PORTAL_VAULT_PASSWORD_RECOVERY_KEY: ${PORTAL_VAULT_PASSWORD_RECOVERY_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      portal-vault:
        condition: service_healthy
    volumes:
      # Live, bidirectional development mounts. Python reloads automatically;
      # DEBUG=true serves UI sources directly without rebuilding the image.
      - ./api:/app/api
      - ./agents:/app/agents
      - ./config:/app/config
      - ./models:/app/models
      - ./services:/app/services
      - ./utils:/app/utils
      - ./workflows:/app/workflows
      - ./ui:/app/ui
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./main.py:/app/main.py
      - ./alembic.ini:/app/alembic.ini
      - ./.env:/app/.env
      # Persist runtime output outside the container.
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./generated:/app/generated
      # Legacy resume files stay mounted until `scripts/migrate_resume_storage.py`
      # has moved every row to MinIO and the migration has been verified.
      - resume_data:/app/data
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app", "--reload-include", ".env"]

volumes:
  postgres_data:
  redis_data:
  resume_data:
  minio_data:
  portal_vault_data:
  portal_vault_config_data:
